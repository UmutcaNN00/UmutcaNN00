<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Umutcan — Local-First Big Data &amp; AI Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="techDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45"/>
    </pattern>
    <clipPath id="heroClip">
      <rect x="1" y="1" width="998" height="218" rx="16"/>
    </clipPath>
    <style><![CDATA[
      .pulse-dot { animation: pulseDot 2.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.75); } }
      .glow-a { animation: floatA 8s ease-in-out infinite; }
      .glow-b { animation: floatB 10s ease-in-out infinite; }
      @keyframes floatA { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(28px, -14px); } }
      @keyframes floatB { 0%, 100% { transform: translate(0px, 0px); } 50% { transform: translate(-24px, 16px); } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: eqBar 2.8s ease-in-out infinite; }
      .b1 { animation-delay: 0.0s; }
      .b2 { animation-delay: 0.25s; }
      .b3 { animation-delay: 0.5s; }
      .b4 { animation-delay: 0.75s; }
      .b5 { animation-delay: 1.0s; }
      .b6 { animation-delay: 1.25s; }
      .b7 { animation-delay: 1.5s; }
      @keyframes eqBar { 0%, 100% { transform: scaleY(0.55); opacity: 0.78; } 50% { transform: scaleY(1.0); opacity: 1; } }
      .signal { stroke-dasharray: 8 6; animation: dashFlow 3.5s linear infinite; }
      @keyframes dashFlow { to { stroke-dashoffset: -56; } }
      .accent-shimmer { animation: shimmerBar 3.2s ease-in-out infinite; }
      @keyframes shimmerBar { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    ]]></style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="1000" height="220" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1000" height="220" fill="url(#techDots)"/>
    <circle class="glow-a" cx="190" cy="45" r="220" fill="url(#glowCyan)"/>
    <circle class="glow-b" cx="840" cy="185" r="210" fill="url(#glowEmerald)"/>

    <!-- Left Block -->
    <g transform="translate(42, 34)">
      <rect x="0" y="0" width="318" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="14" r="6" fill="#10b981" opacity="0.22"/>
      <circle class="pulse-dot" cx="16" cy="14" r="3.5" fill="#10b981"/>
      <text x="30" y="18" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">LOCAL-FIRST · BIG DATA &amp; AI SYSTEMS</text>

      <text x="0" y="88" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Umutcan</text>
      <text x="2" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Büyük Veri Analitiği · Bilimsel İstatistik · Otonom Sistemler</text>

      <rect x="2" y="138" width="340" height="4" rx="2" fill="#1e293b"/>
      <rect class="accent-shimmer" x="2" y="138" width="235" height="4" rx="2" fill="url(#accentBar)"/>
    </g>

    <!-- Right Block: Animated Data Telemetry Widget -->
    <g transform="translate(615, 24)">
      <rect x="0" y="0" width="345" height="172" rx="12" fill="#090f1d" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.7">ENGINE TELEMETRY · ZERO-COPY STREAM</text>
      <circle cx="323" cy="20" r="3.5" fill="#38bdf8" class="pulse-dot"/>

      <!-- Grid baseline -->
      <line x1="18" y1="118" x2="327" y2="118" stroke="#1e293b" stroke-width="1"/>
      <line x1="18" y1="78" x2="327" y2="78" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>

      <!-- 7 Equalizer Bars -->
      <rect class="bar b1" x="28"  y="72" width="24" height="46" rx="4" fill="url(#barCyan)"/>
      <rect class="bar b2" x="68"  y="56" width="24" height="62" rx="4" fill="url(#barEmerald)"/>
      <rect class="bar b3" x="108" y="64" width="24" height="54" rx="4" fill="url(#barCyan)"/>
      <rect class="bar b4" x="148" y="44" width="24" height="74" rx="4" fill="url(#barEmerald)"/>
      <rect class="bar b5" x="188" y="54" width="24" height="64" rx="4" fill="url(#barCyan)"/>
      <rect class="bar b6" x="228" y="40" width="24" height="78" rx="4" fill="url(#barEmerald)"/>
      <rect class="bar b7" x="268" y="50" width="24" height="68" rx="4" fill="url(#barCyan)"/>

      <!-- Animated Signal Curve -->
      <path class="signal" d="M 28 96 Q 80 62, 130 82 T 230 56 T 318 46" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="318" cy="46" r="4" fill="#10b981"/>

      <!-- 3 Metric Chips -->
      <g transform="translate(16, 131)">
        <rect x="0" y="0" width="99" height="27" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="49.5" y="17.5" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">174.6M satır</text>

        <rect x="107" y="0" width="99" height="27" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="156.5" y="17.5" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">60 grafik</text>

        <rect x="214" y="0" width="99" height="27" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="263.5" y="17.5" text-anchor="middle" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">%100 yerel</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="218" rx="16" fill="none" stroke="#1e293b" stroke-width="1.2"/>
</svg>
