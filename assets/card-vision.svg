<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 195" width="490" height="195" role="img" aria-label="desktop-vision-agent Card">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#30d158" stop-opacity="0"/>
    </linearGradient>
    <filter id="cvGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cvClip">
      <rect x="1.5" y="1.5" width="487" height="192" rx="14"/>
    </clipPath>
    <style><![CDATA[
      .laser-scan { animation: scanY 3.0s ease-in-out infinite; }
      @keyframes scanY { 0%, 100% { transform: translateY(14px); } 50% { transform: translateY(94px); } }
      .target-pulse { animation: tgtPulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes tgtPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.55; } }
    ]]></style>
  </defs>

  <g clip-path="url(#cvClip)">
    <rect x="0" y="0" width="490" height="195" fill="url(#cvBg)"/>
    <rect x="20" y="1" width="450" height="2" fill="url(#topCyan)"/>

    <g transform="translate(22, 20)">
      <rect x="0" y="0" width="136" height="22" rx="11" fill="#132a1b" fill-opacity="0.45" stroke="#30d158" stroke-opacity="0.5"/>
      <circle class="target-pulse" cx="12" cy="11" r="3" fill="#30d158"/>
      <text x="23" y="14.5" fill="#30d158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">PUBLIC · PYTHON</text>

      <text x="0" y="54" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20.5" font-weight="800" letter-spacing="-0.4">desktop-vision-agent</text>
      <text x="0" y="80" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
        <tspan x="0" dy="0">Windows masaüstü algılama, çoklu monitör</tspan>
        <tspan x="0" dy="18">yakalama, UI Automation (UIA) ve çevrimdışı</tspan>
        <tspan x="0" dy="18">OCR kontrol motoru.</tspan>
      </text>
    </g>

    <g transform="translate(314, 18)">
      <rect x="0" y="0" width="154" height="118" rx="10" fill="#000000" stroke="#27272f" stroke-width="1"/>
      <text x="144" y="16" text-anchor="end" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">↗</text>
      <rect x="14" y="20" width="126" height="84" rx="6" fill="#141417" stroke="#27272f" stroke-width="1"/>
      <line x1="14" y1="34" x2="140" y2="34" stroke="#27272f" stroke-width="1"/>
      <circle cx="22" cy="27" r="2" fill="#424245"/>
      <circle cx="29" cy="27" r="2" fill="#424245"/>
      <rect x="24" y="44" width="54" height="10" rx="3" fill="#27272f"/>
      <rect x="24" y="62" width="104" height="8" rx="3" fill="#27272f" opacity="0.7"/>
      <rect x="24" y="78" width="76" height="8" rx="3" fill="#27272f" opacity="0.5"/>
      <g transform="translate(106, 56)">
        <circle class="target-pulse" cx="0" cy="0" r="10" fill="none" stroke="#30d158" stroke-width="1.4" stroke-dasharray="4 3"/>
        <circle cx="0" cy="0" r="2.5" fill="#30d158"/>
      </g>
      <rect class="laser-scan" x="12" y="0" width="130" height="2.5" rx="1.25" fill="url(#laserGrad)" filter="url(#cvGlow)"/>
    </g>

    <g transform="translate(22, 152)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
      <rect x="0"   y="0" width="52"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="26"  y="15.5" text-anchor="middle" fill="#38bdf8">UIA</text>
      <rect x="60"  y="0" width="96"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="108" y="15.5" text-anchor="middle" fill="#30d158">Offline OCR</text>
      <rect x="164" y="0" width="110" height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="219" y="15.5" text-anchor="middle" fill="#c4c4cc">Multi-Monitor</text>
      <rect x="282" y="0" width="88"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="326" y="15.5" text-anchor="middle" fill="#bf5af2">AI Agents</text>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="487" height="192" rx="14" fill="none" stroke="#27272f" stroke-width="1.2"/>
</svg>
