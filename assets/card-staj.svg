<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 195" width="490" height="195" role="img" aria-label="Staj-Projeleri Card">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="topEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30d158" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="csClip">
      <rect x="1.5" y="1.5" width="487" height="192" rx="14"/>
    </clipPath>
    <style><![CDATA[
      .pbar { transform-box: fill-box; transform-origin: left; animation: barPulse 3.4s ease-in-out infinite; }
      .p1 { animation-delay: 0s; }
      .p2 { animation-delay: 0.4s; }
      .p3 { animation-delay: 0.8s; }
      .p4 { animation-delay: 1.2s; }
      @keyframes barPulse { 0%, 100% { transform: scaleX(0.75); opacity: 0.85; } 50% { transform: scaleX(1.0); opacity: 1; } }
      .led { animation: ledBlink 2.2s ease-in-out infinite; }
      @keyframes ledBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    ]]></style>
  </defs>

  <g clip-path="url(#csClip)">
    <rect x="0" y="0" width="490" height="195" fill="url(#csBg)"/>
    <rect x="20" y="1" width="450" height="2" fill="url(#topEmerald)"/>

    <g transform="translate(22, 20)">
      <rect x="0" y="0" width="152" height="22" rx="11" fill="#172536" fill-opacity="0.45" stroke="#38bdf8" stroke-opacity="0.5"/>
      <circle class="led" cx="12" cy="11" r="3" fill="#38bdf8"/>
      <text x="23" y="14.5" fill="#64d2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600">PUBLIC · HTML / JS</text>

      <text x="0" y="54" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21.5" font-weight="800" letter-spacing="-0.4">Staj-Projeleri</text>
      <text x="0" y="80" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
        <tspan x="0" dy="0">Operasyonel dijitalleşme ve veri yönetimi için</tspan>
        <tspan x="0" dy="18">LocalStorage tabanlı dinamik İK rehberi ve</tspan>
        <tspan x="0" dy="18">satın alma kayıt arayüzleri.</tspan>
      </text>
    </g>

    <g transform="translate(314, 18)">
      <rect x="0" y="0" width="154" height="118" rx="10" fill="#000000" stroke="#27272f" stroke-width="1"/>
      <text x="144" y="16" text-anchor="end" fill="#30d158" font-family="ui-monospace, monospace" font-size="11" font-weight="700">↗</text>

      <g transform="translate(14, 24)">
        <circle class="led" cx="5" cy="7" r="3" fill="#38bdf8"/>
        <rect x="16" y="4" width="112" height="6" rx="3" fill="#27272f"/>
        <rect class="pbar p1" x="16" y="4" width="96" height="6" rx="3" fill="#38bdf8"/>

        <circle class="led" cx="5" cy="29" r="3" fill="#30d158"/>
        <rect x="16" y="26" width="112" height="6" rx="3" fill="#27272f"/>
        <rect class="pbar p2" x="16" y="26" width="82" height="6" rx="3" fill="#30d158"/>

        <circle class="led" cx="5" cy="51" r="3" fill="#5e5ce6"/>
        <rect x="16" y="48" width="112" height="6" rx="3" fill="#27272f"/>
        <rect class="pbar p3" x="16" y="48" width="104" height="6" rx="3" fill="#5e5ce6"/>

        <circle class="led" cx="5" cy="73" r="3" fill="#38bdf8"/>
        <rect x="16" y="70" width="112" height="6" rx="3" fill="#27272f"/>
        <rect class="pbar p4" x="16" y="70" width="72" height="6" rx="3" fill="#38bdf8"/>
      </g>
    </g>

    <g transform="translate(22, 152)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
      <rect x="0"   y="0" width="64"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="32"  y="15.5" text-anchor="middle" fill="#ff9f0a">HTML5</text>
      <rect x="72"  y="0" width="58"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="101" y="15.5" text-anchor="middle" fill="#38bdf8">CSS3</text>
      <rect x="138" y="0" width="94"  height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="185" y="15.5" text-anchor="middle" fill="#ff9f0a">JavaScript</text>
      <rect x="240" y="0" width="108" height="24" rx="6" fill="#141417" stroke="#27272f"/><text x="294" y="15.5" text-anchor="middle" fill="#30d158">LocalStorage</text>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="487" height="192" rx="14" fill="none" stroke="#27272f" stroke-width="1.2"/>
</svg>
