<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="DataViz Flagship Platform Card">
  <defs>
    <linearGradient id="dvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e"/>
      <stop offset="65%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="dvTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dvSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="dvAura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dvAura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="dvGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dvClip">
      <rect x="1.5" y="1.5" width="997" height="207" rx="16"/>
    </clipPath>
    <style><![CDATA[
      .dv-trace { stroke-dasharray: 200 2200; animation: dvLoop 7.5s linear infinite; }
      @keyframes dvLoop { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -2400; } }
      .ring1 { transform-box: fill-box; transform-origin: center; animation: spinCw 16s linear infinite; }
      .ring2 { transform-box: fill-box; transform-origin: center; animation: spinCcw 11s linear infinite; }
      .ring3 { transform-box: fill-box; transform-origin: center; animation: spinCw 7s linear infinite; }
      @keyframes spinCw  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCcw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      .core { transform-box: fill-box; transform-origin: center; animation: corePulse 2.4s ease-in-out infinite; }
      @keyframes corePulse { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.22); opacity: 0.65; } }
    ]]></style>
  </defs>

  <g clip-path="url(#dvClip)">
    <rect x="0" y="0" width="1000" height="210" fill="url(#dvBg)"/>
    <circle cx="150" cy="40" r="200" fill="url(#dvAura1)"/>
    <circle cx="840" cy="105" r="190" fill="url(#dvAura2)"/>

    <g transform="translate(30, 24)">
      <rect x="0" y="0" width="214" height="26" rx="13" fill="#172536" stroke="#0284c7" stroke-width="1"/>
      <circle class="core" cx="15" cy="13" r="3.5" fill="#38bdf8"/>
      <text x="27" y="17" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.6">FLAGSHIP · PRIVATE AR-GE</text>

      <text x="0" y="70" fill="url(#dvTitle)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">DataViz</text>
      <text x="0" y="100" fill="#c4c4cc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">
        <tspan x="0" dy="0">Kodlama gerektirmeyen, yerel-öncelikli büyük veri analitiği ve bilimsel</tspan>
        <tspan x="0" dy="20">istatistik platformu. Sıfır-kopyalama, AI veri sağaltımı ve APA-7 PDF motoru.</tspan>
      </text>

      <g transform="translate(0, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
        <rect x="0"   y="0" width="124" height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="62"  y="16.5" text-anchor="middle" fill="#7dd3fc">Polars Streaming</text>
        <rect x="132" y="0" width="88"  height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="176" y="16.5" text-anchor="middle" fill="#c4c4cc">DuckDB 2.0</text>
        <rect x="228" y="0" width="76"  height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="266" y="16.5" text-anchor="middle" fill="#f5f5f7">PyArrow</text>
        <rect x="312" y="0" width="64"  height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="344" y="16.5" text-anchor="middle" fill="#c4c4cc">SciPy</text>
        <rect x="384" y="0" width="84"  height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="426" y="16.5" text-anchor="middle" fill="#7dd3fc">60 Grafik</text>
        <rect x="476" y="0" width="86"  height="25" rx="6" fill="#1b1b20" stroke="#27272f"/><text x="519" y="16.5" text-anchor="middle" fill="#c4c4cc">APA-7 PDF</text>
      </g>
    </g>

    <g transform="translate(665, 16)">
      <rect x="0" y="0" width="310" height="178" rx="12" fill="#0c0c0e" fill-opacity="0.88" stroke="#27272f" stroke-width="1"/>
      <text x="14" y="21" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.6">3D DATA GALAXY · PCA MANIFOLD</text>

      <g transform="translate(155, 84)">
        <g class="ring1">
          <circle cx="0" cy="0" r="54" fill="none" stroke="#27272f" stroke-width="1.2" stroke-dasharray="6 5"/>
          <circle cx="54" cy="0" r="4" fill="#38bdf8" filter="url(#dvGlow)"/>
          <circle cx="-46" cy="28" r="3" fill="#0369a1"/>
        </g>
        <g class="ring2">
          <circle cx="0" cy="0" r="37" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.1" stroke-dasharray="12 6"/>
          <circle cx="0" cy="-37" r="4" fill="#0284c7" filter="url(#dvGlow)"/>
          <circle cx="-32" cy="18" r="2.8" fill="#38bdf8"/>
        </g>
        <g class="ring3">
          <circle cx="0" cy="0" r="20" fill="none" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="5 4"/>
          <circle cx="20" cy="0" r="3.2" fill="#7dd3fc" filter="url(#dvGlow)"/>
        </g>
        <circle class="core" cx="0" cy="0" r="7" fill="#38bdf8" filter="url(#dvGlow)"/>
      </g>

      <rect x="14" y="146" width="282" height="22" rx="6" fill="#141417" stroke="#27272f" stroke-width="1"/>
      <text x="155" y="160.5" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">
        <tspan fill="#f5f5f7">174.6M satır</tspan><tspan fill="#3f3f4a">  ·  </tspan><tspan fill="#7dd3fc">1.24s JOIN</tspan><tspan fill="#3f3f4a">  ·  </tspan><tspan fill="#38bdf8">41ms</tspan>
      </text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="997" height="207" rx="16" fill="none" stroke="#27272f" stroke-width="1.2"/>
  <rect class="dv-trace" x="1.5" y="1.5" width="997" height="207" rx="16" fill="none" stroke="url(#dvSweep)" stroke-width="1.8" filter="url(#dvGlow)"/>
</svg>
