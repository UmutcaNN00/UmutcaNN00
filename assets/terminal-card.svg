<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 255" width="1000" height="255" role="img" aria-label="Umutcan HUD System Terminal">
  <defs>
    <clipPath id="termClip">
      <rect x="1.5" y="1.5" width="997" height="252" rx="14"/>
    </clipPath>
    <style><![CDATA[
      .ln { opacity: 0; animation: fadeInLine 0.45s ease-out forwards; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.2px; }
      .l1 { animation-delay: 0.1s; }
      .l2 { animation-delay: 0.25s; }
      .l3 { animation-delay: 0.4s; }
      .l4 { animation-delay: 0.55s; }
      .l5 { animation-delay: 0.7s; }
      .l6 { animation-delay: 0.85s; }
      @keyframes fadeInLine { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blinkCur 1.1s steps(2, start) infinite; }
      @keyframes blinkCur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .hud-led { animation: hudPulse 2.1s ease-in-out infinite; }
      @keyframes hudPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    ]]></style>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="0" y="0" width="1000" height="255" fill="#0b1120"/>
    <rect x="0" y="0" width="1000" height="36" fill="#111827"/>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="62" cy="18" r="5.5" fill="#10b981"/>
    <text x="500" y="22" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">umutcan@local-first — zsh</text>

    <text class="ln l1" x="26" y="66">
      <tspan fill="#10b981" font-weight="700">$</tspan><tspan fill="#e2e8f0"> cat profile.yml</tspan>
    </text>
    <text class="ln l2" x="26" y="94">
      <tspan fill="#38bdf8" font-weight="600">focus:   </tspan><tspan fill="#cbd5e1">Büyük Veri Analitiği, Yerel-Öncelikli Sistemler, Bilimsel İstatistik</tspan>
    </text>
    <text class="ln l3" x="26" y="121">
      <tspan fill="#38bdf8" font-weight="600">flagship:</tspan><tspan fill="#e2e8f0"> DataViz (Polars Streaming · DuckDB 2.0 · 60 Grafik · APA-7 PDF) </tspan><tspan fill="#64748b"># Private · Ar-Ge</tspan>
    </text>
    <text class="ln l4" x="26" y="148">
      <tspan fill="#38bdf8" font-weight="600">agents:  </tspan><tspan fill="#e2e8f0">desktop-vision-agent (Windows UIA · Çevrimdışı OCR · OS Kontrol) </tspan><tspan fill="#10b981"># Public</tspan>
    </text>
    <text class="ln l5" x="26" y="175">
      <tspan fill="#38bdf8" font-weight="600">web:     </tspan><tspan fill="#e2e8f0">Staj-Projeleri (Operasyonel Dijitalleşme &amp; Veri Yönetimi) </tspan><tspan fill="#10b981"># Public</tspan>
    </text>
    <text class="ln l6" x="26" y="202">
      <tspan fill="#38bdf8" font-weight="600">motto:   </tspan><tspan fill="#a7f3d0">"Sıfır-kopyalama, sıfır bulut, yüksek hız."  </tspan><tspan class="cursor" fill="#38bdf8">█</tspan>
    </text>

    <rect x="0" y="220" width="1000" height="35" fill="#0f172a"/>
    <line x1="0" y1="220" x2="1000" y2="220" stroke="#1e293b" stroke-width="1"/>
    <circle class="hud-led" cx="26" cy="237.5" r="4" fill="#10b981"/>
    <text x="40" y="241.5" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">
      <tspan fill="#10b981">ONLINE</tspan><tspan fill="#475569">  |  </tspan><tspan fill="#38bdf8">ENGINE: ZERO-COPY</tspan><tspan fill="#475569">  |  </tspan><tspan fill="#cbd5e1">PRIVACY: 100% LOCAL</tspan><tspan fill="#475569">  |  </tspan><tspan fill="#a5b4fc">MODE: SHIPPING</tspan>
    </text>
  </g>
  <rect x="1.5" y="1.5" width="997" height="252" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>
</svg>
