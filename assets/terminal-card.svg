<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" width="1000" height="235" role="img" aria-label="Umutcan System Profile Terminal">
  <defs>
    <clipPath id="termClip">
      <rect x="1" y="1" width="998" height="233" rx="14"/>
    </clipPath>
    <style><![CDATA[
      .ln { opacity: 0; animation: fadeInLine 0.5s ease-out forwards; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; }
      .l1 { animation-delay: 0.1s; }
      .l2 { animation-delay: 0.3s; }
      .l3 { animation-delay: 0.5s; }
      .l4 { animation-delay: 0.7s; }
      .l5 { animation-delay: 0.9s; }
      .l6 { animation-delay: 1.1s; }
      @keyframes fadeInLine { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blinkCur 1.1s steps(2, start) infinite; }
      @keyframes blinkCur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    ]]></style>
  </defs>

  <g clip-path="url(#termClip)">
    <rect x="0" y="0" width="1000" height="235" fill="#0b1120"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="1000" height="38" fill="#111827"/>
    <line x1="0" y1="38" x2="1000" y2="38" stroke="#1e293b" stroke-width="1"/>
    <circle cx="22" cy="19" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5.5" fill="#f59e0b"/>
    <circle cx="62" cy="19" r="5.5" fill="#10b981"/>
    <text x="500" y="23" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">umutcan@local-first — zsh</text>

    <!-- Terminal Lines -->
    <text class="ln l1" x="26" y="70">
      <tspan fill="#10b981" font-weight="700">$</tspan><tspan fill="#e2e8f0"> cat profile.yml</tspan>
    </text>
    <text class="ln l2" x="26" y="100">
      <tspan fill="#38bdf8" font-weight="600">focus:   </tspan><tspan fill="#cbd5e1">Büyük Veri Analitiği, Yerel-Öncelikli Sistemler, Bilimsel İstatistik</tspan>
    </text>
    <text class="ln l3" x="26" y="128">
      <tspan fill="#38bdf8" font-weight="600">flagship:</tspan><tspan fill="#e2e8f0"> DataViz (Polars Streaming · DuckDB 2.0 · 60 Grafik · APA-7 PDF) </tspan><tspan fill="#64748b"># Private · Ar-Ge</tspan>
    </text>
    <text class="ln l4" x="26" y="156">
      <tspan fill="#38bdf8" font-weight="600">agents:  </tspan><tspan fill="#e2e8f0">desktop-vision-agent (Windows UIA · Çevrimdışı OCR · OS Kontrol) </tspan><tspan fill="#10b981"># Public</tspan>
    </text>
    <text class="ln l5" x="26" y="184">
      <tspan fill="#38bdf8" font-weight="600">web:     </tspan><tspan fill="#e2e8f0">Staj-Projeleri (Operasyonel Dijitalleşme &amp; Veri Yönetimi) </tspan><tspan fill="#10b981"># Public</tspan>
    </text>
    <text class="ln l6" x="26" y="212">
      <tspan fill="#38bdf8" font-weight="600">motto:   </tspan><tspan fill="#a7f3d0">"Sıfır-kopyalama, sıfır bulut, yüksek hız."  </tspan><tspan class="cursor" fill="#38bdf8">█</tspan>
    </text>
  </g>
  <rect x="1" y="1" width="998" height="233" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>
</svg>
