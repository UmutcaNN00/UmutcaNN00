    <style><![CDATA[
      .bus-flow { stroke-dasharray: 6 6; animation: busMove 1.8s linear infinite; }
      @keyframes busMove { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      .dot-pulse { animation: dp 2.4s ease-in-out infinite; }
      @keyframes dp { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    ]]></style>
  </defs>

